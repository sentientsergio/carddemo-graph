[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carddemo-graph"
version = "0.1.0"
description = "Evidence-grounded knowledge-base extractor over AWS CardDemo"
requires-python = ">=3.11"
dependencies = [
  "kuzu>=0.6",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
